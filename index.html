<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CryptoShields | Web3 Security & OPSEC</title>
  <meta name="description" content="CryptoShields — Detecting, flagging, and neutralizing crypto scams, rug pulls, and Web3 threats. Community-driven OPSEC for the decentralized world." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow+Condensed:wght@300;400;600;700;900&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #050708;
      --surface: #0a0d10;
      --surface2: #0f1318;
      --cyan: #00f0d4;
      --cyan-dim: #00c4ae;
      --cyan-glow: rgba(0, 240, 212, 0.15);
      --cyan-glow2: rgba(0, 240, 212, 0.06);
      --red: #ff3b3b;
      --red-dim: #cc2222;
      --text: #d4dde6;
      --text-dim: #7a8a96;
      --text-faint: #3a4a54;
      --border: rgba(0, 240, 212, 0.18);
      --border-faint: rgba(255,255,255,0.05);
      --mono: 'Share Tech Mono', monospace;
      --display: 'Barlow Condensed', sans-serif;
      --body: 'Barlow', sans-serif;
    }

    /* Existing website styles go here */

    .btn-donate {
      font-family: var(--mono);
      font-size: 13px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--bg);
      background: var(--cyan);
      padding: 16px 40px;
      text-decoration: none;
      clip-path: polygon(14px 0%, 100% 0%, calc(100% - 14px) 100%, 0% 100%);
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      transition: all 0.2s;
    }

    .btn-donate:hover {
      background: #fff;
      transform: translateY(-2px);
      box-shadow: 0 0 32px rgba(0,240,212,0.35);
    }
  </style>
</head>

      <div class="donate-cta-group">
        <a href="https://ens.com" class="btn-donate">ENS Donate</a>
        <a href="https://giveth.io/project/cryptoshields" class="btn-donate">Giveth Donate</a>
