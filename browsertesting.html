<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Extension Detection</title>
</head>
<body>

<script>
  window.onload = function() {
    // background.js or popup.js
  chrome.runtime.sendMessage({ extensionDetected: true });
  // content.js
chrome.runtime.onMessage.addListener(
  function(request, sender, sendResponse) {
    if (request.extensionDetected) {
      // Do something on the web page when the extension is detected
      console.log("Extension detected on the page!");
    }
  }
);

  };
</script>

</body>
</html>
