<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Extension Detection</title>
</head>
<body>

<script>
  window.onload = function() {
    if (typeof chrome !== "undefined" && chrome.runtime) {
      chrome.runtime.getManifest(function(manifest) {
        var extensionName = manifest.name;
        //console.log("Extension is running on Chrome. Extension Name:", extensionName);
        alert("Extension is running on Chrome. Extension Name:", extensionName);
        // Display the extension name on the page
        var extensionNameElement = document.createElement("p");
        extensionNameElement.textContent = "Extension Name: " + extensionName;
        document.body.appendChild(extensionNameElement);

        // Your code for when the extension is running on Chrome
      });
    } else {
      console.log("Extension is not running on Chrome");
      // Your code for when the extension is not running on Chrome
    }
  };
</script>

</body>
</html>
